version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: monitorillo-postgres
    environment:
      POSTGRES_USER: monitorillo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: monitorillo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitorillo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monitorillo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitorillo-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://monitorillo:password@postgres:5432/monitorillo
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-to-a-random-secret-key-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - API_V1_PREFIX=/api/v1
      - PROJECT_NAME=Monitorillo
      - DEBUG=True
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - DAEMON_API_KEY=change-this-to-a-random-api-key
      - RESEND_API_KEY=your-resend-api-key
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitorillo-worker
    command: python app/worker.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://monitorillo:password@postgres:5432/monitorillo
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
