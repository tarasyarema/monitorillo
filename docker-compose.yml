version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: monitorillo-postgres
    environment:
      POSTGRES_USER: monitorillo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: monitorillo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitorillo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monitorillo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

